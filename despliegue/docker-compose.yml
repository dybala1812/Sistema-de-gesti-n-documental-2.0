# SGD · Archivo Central — producción con PostgreSQL propio (D-29, D-31). Sin Supabase.
#
#   db           PostgreSQL 18 con los datos (volumen datos_postgres). Solo red interna.
#   migraciones  aplica las migraciones que falten, seed.sql y el rol del backend; termina y se apaga
#   backend      el backend Next.js. Se conecta directo a PostgreSQL con el rol sgd_backend (driver pg).
#                Se une a la red de Docker de NOVA (RED_NOVA) con el alias sgd_backend: el nginx de
#                NOVA lo publica en https://<dominio de NOVA>/sgd-api/ (mismo dominio, sin CORS).
#
# Uso (desde despliegue/):  cp .env.ejemplo .env   →   completar   →   docker compose up -d --build
# Guía completa: README_DEPLOY.md en la raíz del repositorio.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sgd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - datos_postgres:/var/lib/postgresql
    # Para administrar la base desde el propio servidor (psql, pgAdmin por túnel SSH), descomentar:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sgd"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migraciones:
    image: postgres:18-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/sgd
      SGD_BACKEND_PASSWORD: ${SGD_BACKEND_PASSWORD:?Falta SGD_BACKEND_PASSWORD}
    volumes:
      - ../database:/database:ro
    entrypoint: ["bash", "/database/scripts/instalar_local.sh"]
    restart: "no"

  backend:
    build: ../backned_sistema_gestion_documental
    image: sgd-backend:latest
    depends_on:
      migraciones:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://sgd_backend:${SGD_BACKEND_PASSWORD}@db:5432/sgd
      NOVA_API_URL: ${NOVA_API_URL:?Falta NOVA_API_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Falta ALLOWED_ORIGINS}
      N8N_SERVICE_TOKEN: ${N8N_SERVICE_TOKEN:-}
      N8N_WEBHOOK_REMITIR_URL: ${N8N_WEBHOOK_REMITIR_URL:-}
      N8N_WEBHOOK_RESPONDER_URL: ${N8N_WEBHOOK_RESPONDER_URL:-}
      N8N_WEBHOOK_RECORDATORIO_URL: ${N8N_WEBHOOK_RECORDATORIO_URL:-}
      TZ: ${TZ:-UTC}
    ports:
      - "${PUERTO_BACKEND:-127.0.0.1:3000}:3000"
    volumes:
      - archivos_sgd:/data/archivos
    networks:
      default:
      nova:
        aliases:
          - sgd_backend
    restart: unless-stopped

networks:
  # Red de Docker donde corre NOVA (ver con `docker network ls`). Debe existir antes de levantar.
  nova:
    external: true
    name: ${RED_NOVA:?Falta RED_NOVA (la red de Docker de NOVA, ver docker network ls)}

volumes:
  # Respaldar los dos juntos: la base referencia cada archivo por su id (RN-AC-14). Ver respaldar.sh.
  datos_postgres:
  archivos_sgd:
