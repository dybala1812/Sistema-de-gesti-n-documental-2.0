# El backend usa el cliente de Supabase, que llama a <SUPABASE_URL>/rest/v1/...
# Aquí /rest/v1/ se pasa a PostgREST. Solo se usa dentro de la red de Docker: no se publica.
server {
  listen 8000;
  client_max_body_size 20m;
  location /rest/v1/ {
    proxy_pass http://postgrest:3000/;
    proxy_set_header Host $host;
  }
}
